<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cheng Qian — cross-platform product engineer</title>
  <desc id="desc">Nine years building for web, mobile, desktop, and the WeChat ecosystem.</desc>
  <defs>
    <linearGradient id="panel" x1="28" y1="18" x2="1172" y2="342" gradientUnits="userSpaceOnUse"><stop stop-color="#12181B"/><stop offset="0.58" stop-color="#0A0E11"/><stop offset="1" stop-color="#071013"/></linearGradient>
    <linearGradient id="signal" x1="70" y1="0" x2="1130" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#D9FF57"/><stop offset="0.36" stop-color="#62F5C7"/><stop offset="0.7" stop-color="#75A7FF"/><stop offset="1" stop-color="#FFAF66"/></linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(940 170) rotate(180) scale(480 270)"><stop stop-color="#53E8BD" stop-opacity="0.12"/><stop offset="1" stop-color="#53E8BD" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" stroke="#DCE7EA" stroke-opacity="0.045"/></pattern>
    <filter id="softGlow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="1200" height="360" rx="24"/></clipPath>
    <style>
      .signal { stroke-dasharray: 10 14; animation: flow 5s linear infinite; }
      .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
      .pulse-d2 { animation-delay: .8s; }
      .pulse-d3 { animation-delay: 1.6s; }
      @keyframes flow { to { stroke-dashoffset: -48; } }
      @keyframes pulse { 0%, 100% { opacity: .45; transform: scale(.72); } 50% { opacity: 1; transform: scale(1.08); } }
      @media (prefers-reduced-motion: reduce) { .signal, .pulse { animation: none; } }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="360" fill="#080C0E"/>
    <rect x="1" y="1" width="1198" height="358" rx="23" fill="url(#panel)" stroke="#DCE7EA" stroke-opacity="0.13" stroke-width="2"/>
    <rect width="1200" height="360" fill="url(#grid)"/>
    <rect width="1200" height="360" fill="url(#glow)"/>
    <path d="M0 71H1200M0 290H1200" stroke="#DCE7EA" stroke-opacity="0.075"/>
    <path class="signal" d="M70 290C205 290 217 257 337 257C459 257 461 290 585 290C708 290 727 246 846 246C967 246 1007 290 1130 290" stroke="url(#signal)" stroke-opacity="0.5" stroke-width="1.5"/>
    <g transform="translate(70 28)"><circle cx="5" cy="5" r="5" fill="#62F5C7" filter="url(#softGlow)"/><text x="20" y="9" fill="#9EABB0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.8">SYSTEM ONLINE / REBUILDING HOME</text></g>
    <text x="1130" y="38" fill="#667277" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="1.5">9 YEARS ACROSS SCREENS</text>
    <text x="70" y="135" fill="#D9FF57" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="3.8">CHENG QIAN / PRODUCT ENGINEERING</text>
    <text x="67" y="199" fill="#F2F7F5" font-family="Georgia,serif" font-size="51" font-weight="700">Cross-platform by design.</text>
    <text x="70" y="238" fill="#AAB5B9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="2.3">WEB  /  MOBILE  /  DESKTOP  /  WECHAT</text>
    <g transform="translate(780 104)">
      <circle cx="128" cy="78" r="54" fill="#0A1113" stroke="#62F5C7" stroke-opacity="0.42"/><circle cx="128" cy="78" r="76" stroke="#DCE7EA" stroke-opacity="0.08" stroke-dasharray="3 8"/><circle cx="128" cy="78" r="4" fill="#F2F7F5"/>
      <text x="128" y="70" fill="#F2F7F5" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" letter-spacing="1.4">ONE CORE</text><text x="128" y="88" fill="#7D898E" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.1">EVERY SCREEN</text>
      <path d="M128 24V-4M182 78H218M128 132V160M74 78H38" stroke="#DCE7EA" stroke-opacity="0.22"/>
      <g transform="translate(106 -22)"><circle class="pulse" cx="22" cy="18" r="4" fill="#D9FF57"/><text x="22" y="2" fill="#D9FF57" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" letter-spacing="1.2">WEB</text></g>
      <g transform="translate(226 61)"><circle class="pulse pulse-d2" cx="0" cy="17" r="4" fill="#62F5C7"/><text x="14" y="20" fill="#62F5C7" font-family="ui-monospace,monospace" font-size="9" letter-spacing="1.2">MOBILE</text></g>
      <g transform="translate(90 169)"><circle class="pulse pulse-d3" cx="38" cy="0" r="4" fill="#75A7FF"/><text x="38" y="19" fill="#75A7FF" text-anchor="middle" font-family="ui-monospace,monospace" font-size="9" letter-spacing="1.2">DESKTOP</text></g>
      <g transform="translate(-16 61)"><circle class="pulse pulse-d2" cx="46" cy="17" r="4" fill="#FFAF66"/><text x="0" y="20" fill="#FFAF66" font-family="ui-monospace,monospace" font-size="9" letter-spacing="1.2">WECHAT</text></g>
    </g>
    <g transform="translate(70 314)"><rect width="1060" height="1" fill="url(#signal)" opacity="0.22"/><text y="23" fill="#657176" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.4">ARCHITECTURE · INTERACTION · PERFORMANCE · DELIVERY</text><text x="1060" y="23" fill="#657176" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="9" letter-spacing="1.4">WUHAN / CN</text></g>
  </g>
</svg>
