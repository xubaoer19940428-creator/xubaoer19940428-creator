<svg width="1200" height="620" viewBox="0 0 1200 620" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Cross-platform technology map</title>
  <desc id="desc">Web, mobile, desktop, and WeChat technologies connected by a shared product engineering core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="620" gradientUnits="userSpaceOnUse"><stop stop-color="#101619"/><stop offset="1" stop-color="#070B0D"/></linearGradient>
    <linearGradient id="bus" x1="145" y1="0" x2="1055" y2="0" gradientUnits="userSpaceOnUse"><stop stop-color="#D9FF57"/><stop offset=".34" stop-color="#62F5C7"/><stop offset=".68" stop-color="#75A7FF"/><stop offset="1" stop-color="#FFAF66"/></linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" stroke="#DCE7EA" stroke-opacity=".035"/></pattern>
    <filter id="glow" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect width="1200" height="620" rx="24"/></clipPath>
    <style>
      .bus { stroke-dasharray: 8 12; animation: travel 4.5s linear infinite; }
      .node { transform-box: fill-box; transform-origin: center; animation: node 3s ease-in-out infinite; }
      .d2 { animation-delay: .75s; } .d3 { animation-delay: 1.5s; } .d4 { animation-delay: 2.25s; }
      @keyframes travel { to { stroke-dashoffset: -40; } }
      @keyframes node { 0%,100% { opacity:.5; } 50% { opacity:1; } }
      @media (prefers-reduced-motion: reduce) { .bus,.node { animation:none; } }
    </style>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="620" fill="#080C0E"/>
    <rect x="1" y="1" width="1198" height="618" rx="23" fill="url(#bg)" stroke="#DCE7EA" stroke-opacity=".12" stroke-width="2"/>
    <rect width="1200" height="620" fill="url(#grid)"/>
    <text x="44" y="48" fill="#F2F7F5" font-family="Georgia,serif" font-size="22" font-weight="700">Technology map</text>
    <text x="1156" y="45" fill="#69767B" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" letter-spacing="1.6">4 SURFACES / 1 ENGINEERING CORE</text>
    <path d="M44 70H1156" stroke="#DCE7EA" stroke-opacity=".09"/>

    <path d="M145 301H1055" stroke="#DCE7EA" stroke-opacity=".1" stroke-width="8"/>
    <path class="bus" d="M145 301H1055" stroke="url(#bus)" stroke-opacity=".72" stroke-width="2"/>
    <g transform="translate(515 270)">
      <rect width="170" height="62" rx="31" fill="#0A1012" stroke="#F2F7F5" stroke-opacity=".2"/>
      <circle cx="29" cy="31" r="5" fill="#62F5C7" filter="url(#glow)"/>
      <text x="49" y="27" fill="#F2F7F5" font-family="ui-monospace,monospace" font-size="10" font-weight="700" letter-spacing="1.2">PRODUCT CORE</text>
      <text x="49" y="43" fill="#69767B" font-family="ui-monospace,monospace" font-size="8" letter-spacing="1">TS · JS · UI · DX</text>
    </g>

    <path d="M156 242V301M452 301V360M748 242V301M1044 301V360" stroke="#DCE7EA" stroke-opacity=".15"/>
    <circle class="node" cx="156" cy="301" r="5" fill="#D9FF57" filter="url(#glow)"/>
    <circle class="node d2" cx="452" cy="301" r="5" fill="#62F5C7" filter="url(#glow)"/>
    <circle class="node d3" cx="748" cy="301" r="5" fill="#75A7FF" filter="url(#glow)"/>
    <circle class="node d4" cx="1044" cy="301" r="5" fill="#FFAF66" filter="url(#glow)"/>

    <g transform="translate(44 92)">
      <rect width="224" height="150" rx="16" fill="#11171A" stroke="#D9FF57" stroke-opacity=".38"/>
      <text x="18" y="27" fill="#D9FF57" font-family="ui-monospace,monospace" font-size="9" font-weight="700" letter-spacing="1.7">01 / WEB</text>
      <text x="18" y="62" fill="#F2F7F5" font-family="Georgia,serif" font-size="24" font-weight="700">React · Vue</text>
      <text x="18" y="91" fill="#AAB5B9" font-family="ui-monospace,monospace" font-size="11">Next.js  /  Nuxt</text>
      <text x="18" y="114" fill="#AAB5B9" font-family="ui-monospace,monospace" font-size="11">TypeScript  /  JavaScript</text>
      <text x="18" y="136" fill="#657176" font-family="ui-monospace,monospace" font-size="8" letter-spacing=".8">SPA · SSR · RESPONSIVE UI</text>
    </g>

    <g transform="translate(340 360)">
      <rect width="224" height="166" rx="16" fill="#11171A" stroke="#62F5C7" stroke-opacity=".38"/>
      <text x="18" y="27" fill="#62F5C7" font-family="ui-monospace,monospace" font-size="9" font-weight="700" letter-spacing="1.7">02 / MOBILE</text>
      <text x="18" y="62" fill="#F2F7F5" font-family="Georgia,serif" font-size="22" font-weight="700">React Native</text>
      <text x="18" y="91" fill="#AAB5B9" font-family="ui-monospace,monospace" font-size="11">uni-app</text>
      <text x="18" y="114" fill="#AAB5B9" font-family="ui-monospace,monospace" font-size="11">Cross-platform UI</text>
      <text x="18" y="137" fill="#AAB5B9" font-family="ui-monospace,monospace" font-size="11">Native integration</text>
      <text x="18" y="153" fill="#657176" font-family="ui-monospace,monospace" font-size="8" letter-spacing=".8">GESTURE · DEVICE ADAPTATION</text>
    </g>

    <g transform="translate(636 92)">
      <rect width="224" height="150" rx="16" fill="#11171A" stroke="#75A7FF" stroke-opacity=".4"/>
      <text x="18" y="27" fill="#75A7FF" font-family="ui-monospace,monospace" font-size="9" font-weight="700" letter-spacing="1.7">03 / DESKTOP</text>
      <text x="18" y="62" fill="#F2F7F5" font-family="Georgia,serif" font-size="24" font-weight="700">Electron</text>
      <text x="18" y="91" fill="#AAB5B9" font-family="ui-monospace,monospace" font-size="11">React  /  Vue  /  Node.js</text>
      <text x="18" y="114" fill="#AAB5B9" font-family="ui-monospace,monospace" font-size="11">IPC  /  File System</text>
      <text x="18" y="136" fill="#657176" font-family="ui-monospace,monospace" font-size="8" letter-spacing=".8">STORAGE · PACKAGE · UPDATE</text>
    </g>

    <g transform="translate(932 360)">
      <rect width="224" height="166" rx="16" fill="#11171A" stroke="#FFAF66" stroke-opacity=".4"/>
      <text x="18" y="27" fill="#FFAF66" font-family="ui-monospace,monospace" font-size="9" font-weight="700" letter-spacing="1.7">04 / WECHAT</text>
      <text x="18" y="62" fill="#F2F7F5" font-family="Georgia,serif" font-size="21" font-weight="700">Mini Programs</text>
      <text x="18" y="91" fill="#AAB5B9" font-family="ui-monospace,monospace" font-size="11">Official Accounts  /  H5</text>
      <text x="18" y="114" fill="#AAB5B9" font-family="ui-monospace,monospace" font-size="11">WeChat JS-SDK</text>
      <text x="18" y="137" fill="#AAB5B9" font-family="ui-monospace,monospace" font-size="11">Platform APIs</text>
      <text x="18" y="153" fill="#657176" font-family="ui-monospace,monospace" font-size="8" letter-spacing=".8">BRIDGE · MULTI-END FLOWS</text>
    </g>

    <g transform="translate(44 559)">
      <path d="M0 0H1112" stroke="#DCE7EA" stroke-opacity=".09"/>
      <text y="27" fill="#657176" font-family="ui-monospace,monospace" font-size="9" letter-spacing="1.4">SHARED LAYER</text>
      <text x="125" y="27" fill="#AAB5B9" font-family="ui-monospace,monospace" font-size="9" letter-spacing="1.25">COMPONENT SYSTEMS  /  STATE  /  MOTION  /  I18N  /  PERFORMANCE  /  RELEASE</text>
      <text x="1112" y="27" fill="#657176" text-anchor="end" font-family="ui-monospace,monospace" font-size="9" letter-spacing="1.4">SIGNAL STABLE</text>
    </g>
  </g>
</svg>
