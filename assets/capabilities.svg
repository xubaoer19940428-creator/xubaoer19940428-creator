    <text x="24" y="160" fill="#8AF6D2" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.6">FAST · RESPONSIVE · ACCESSIBLE</text>
    <text x="24" y="199" fill="#A7B0BA" font-family="ui-monospace,monospace" font-size="13">React / Next.js</text>
    <text x="24" y="222" fill="#A7B0BA" font-family="ui-monospace,monospace" font-size="13">Vue 3 / Nuxt</text>
    <text x="327" y="55" fill="#D8FF3E" text-anchor="end" font-family="ui-monospace,monospace" font-size="11">01</text>
  </g>

  <g transform="translate(422 34)">
    <rect width="356" height="242" rx="18" fill="#151A1F" stroke="#8AF6D2" stroke-opacity=".42"/>
