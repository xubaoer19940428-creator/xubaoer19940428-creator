    <text x="24" y="160" fill="#8AF6D2" font-family="ui-monospace,monospace" font-size="11" letter-spacing="1.6">TACTILE · OFFLINE · NATIVE-FEELING</text>
    <text x="24" y="199" fill="#A7B0BA" font-family="ui-monospace,monospace" font-size="13">React Native / Expo</text>
