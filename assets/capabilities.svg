<svg width="1200" height="310" viewBox="0 0 1200 310" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Three product surfaces</title>
  <desc id="desc">Web, mobile, and desktop engineering capabilities.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="310" gradientUnits="userSpaceOnUse">
      <stop stop-color="#11161A"/><stop offset="1" stop-color="#090B0E"/>
    </linearGradient>
    <linearGradient id="lime" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D8FF3E"/><stop offset="1" stop-color="#8AF6D2"/></linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" stroke="#fff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect x="1" y="1" width="1198" height="308" rx="22" fill="url(#bg)" stroke="#fff" stroke-opacity=".1" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="308" rx="22" fill="url(#grid)"/>

  <g transform="translate(34 34)">
